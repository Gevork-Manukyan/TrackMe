<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TrackMe">
  <!-- Stamped monogram: a wonky serif T pressed inside a passport stamp, slightly
       askew like a hand-pressed mark. Single vermilion reads on light and dark tabs. -->
  <g transform="rotate(-7 32 32)">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#c8402b" stroke-width="2.4" stroke-dasharray="1.6 4.2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#c8402b" stroke-width="4"/>
    <rect x="20" y="21" width="24" height="5.6" rx="2.8" fill="#c8402b"/>
    <rect x="29.2" y="21" width="5.6" height="23" rx="2.6" fill="#c8402b"/>
    <rect x="25.5" y="40.5" width="13" height="4.6" rx="2.3" fill="#c8402b"/>
  </g>
</svg>
