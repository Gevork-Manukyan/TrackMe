name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Placeholder values so `prisma generate` (postinstall) and `next build` run
    # without real secrets. The app renders dynamically and hits no database at
    # build time, so these are never connected to — they only need to exist.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
